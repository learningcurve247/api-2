name: Merger Agent

on:
  pull_request:
    types: [labeled]

jobs:
  auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'tests-passed')
    runs-on: ubuntu-latest

    steps:
      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.16.0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
